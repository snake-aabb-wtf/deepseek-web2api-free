name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run smoke test
        run: |
          python -m tests.smoke

  unit:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/test_sieve.py \
                          tests/test_dsml.py \
                          tests/test_token_counter.py \
                          tests/test_session_cache.py \
                          tests/test_session_binding.py \
                          tests/test_anthropic_server.py \
                          tests/test_model_router.py \
                          tests/test_rate_limiter.py \
                          tests/test_ip_utils.py \
                          tests/test_adapter.py \
                          tests/test_account_pool.py \
                          tests/test_api_keys.py \
                          -v --tb=short

  e2e:
    name: End-to-end validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke, unit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run end-to-end checks
        run: |
          python scripts/run_e2e.py

  webui:
    name: WebUI build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke, unit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui-new/package-lock.json

      - name: Install dependencies
        working-directory: webui-new
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        working-directory: webui-new
        run: npm run build

      - name: Verify build output
        working-directory: webui-new
        run: |
          test -f dist/index.html || (echo "ERROR: dist/index.html missing" && exit 1)
          test -d dist/assets || (echo "ERROR: dist/assets missing" && exit 1)
          echo "WebUI build OK:"
          ls -la dist/
          echo
          echo "Asset sizes:"
          du -sh dist/assets/*

      - name: Upload webui build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui-new/dist/
          if-no-files-found: error
          retention-days: 7
