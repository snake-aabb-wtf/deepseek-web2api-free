name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the deps required by the smoke test.
          # `httpx` is the TestClient transport and is already a runtime dep.
          python -m pip install -r requirements.txt

      - name: Run smoke test
        # The smoke test boots the whole app graph (imports server.py →
        # adapter.py, which reads sha3_wasm_bg.wasm at import time). It
        # exercises /health, /webui, the admin auth flow, and verifies
        # that the webui path-traversal fix holds.
        run: |
          python -m tests.smoke
